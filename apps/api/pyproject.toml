[project]
name = "carve-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "PyJWT[crypto]==2.9.0",
  "passlib[argon2]==1.7.4",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.20",
  "redis==5.2.0",
  "rq==2.0.0",
  "boto3==1.36.5",
  "httpx==0.28.1",
  "email-validator==2.2.0",
  "ffmpeg-python==0.2.0",
  "Pillow==11.1.0",
  "psutil==6.1.1",
  "xxhash==3.5.0",
  "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
  "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carve_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib mode lets us use a tests/io/ subpackage without colliding with the
# stdlib `io` module (the default prepend mode would shadow it).
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]
