[project]
name = "carve-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "Pillow==11.1.0",
  "numpy==2.2.1",
  "boto3==1.36.5",
  "redis==5.2.0",
  "xxhash==3.5.0",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]
gpu = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "ultralytics==8.4.41",
  "opencv-python-headless==4.10.0.84",
  "pycocotools==2.0.8",
  "ffmpeg-python==0.2.0",
  # v3.8 Phase 4-video step F6 -- transformers.video_utils.load_video
  # uses pyav by default; required for SAM 2/3 video tracker init_state.
  "av==13.1.0",
  "transformers==5.0.0",
]
# Plan 11 (SAM 3.1 migration) — native sam3 package required for the
# Object Multiplex multi-object joint tracker. The transformers
# `Sam3VideoModel` cannot load `facebook/sam3.1`'s `sam3.1_multiplex.pt`
# checkpoint (no model.safetensors is published). The pip install pulls
# only the Python package; the multi-GB multiplex checkpoint is
# downloaded lazily from the Hugging Face Hub at runtime.
#
# Kept in its own extras group because sam3 upstream pins `numpy<2`,
# which conflicts with the project's `numpy==2.2.1`. The Dockerfile
# installs `[sam3p1]` with `--no-deps` after the main resolve so the
# resolver never sees the numpy conflict. Numpy 2.x is ABI-compatible
# with sam3 in practice — the upstream cap is conservative.
sam3p1 = [
  "sam3 @ git+https://github.com/facebookresearch/sam3.git",
  "ftfy==6.1.1",
  "iopath>=0.1.10",
  "einops>=0.7",
  "timm>=1.0.17",
]

# v3.21+ — VLM-FO1 precision filter is NOT a pyproject extras because
# the upstream repo (om-ai-lab/VLM-FO1) has no setup.py / pyproject.toml
# and is therefore not pip-installable. The Dockerfile clones it and
# copies the vlm_fo1 package dir into site-packages directly — see
# apps/model/Dockerfile for the install steps and rationale.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required so the `sam3p1` extra can declare `sam3 @ git+https://...` as
# a direct VCS reference (Plan 11 / Task 1).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/carve_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
