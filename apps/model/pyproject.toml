[project]
name = "vaa-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "Pillow==11.1.0",
  "numpy==2.2.1",
  "boto3==1.36.5",
  "redis==5.2.0",
  "xxhash==3.5.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]
gpu = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "ultralytics==8.4.41",
  "opencv-python-headless==4.10.0.84",
  "pycocotools==2.0.8",
  "ffmpeg-python==0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaa_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
