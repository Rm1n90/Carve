[project]
name = "model-vlm-fo1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "Pillow==11.1.0",
  # transformers 4.50.1 is what upstream FO1 was authored against —
  # this pin is the entire reason this sidecar exists. Bumping it
  # without re-validating against the OmChat fork's modeling code is
  # a regression.
  "transformers==4.50.1",
  # numpy 1.x — transformers 4.50 was released against numpy 1 and the
  # OmChat code paths haven't been re-tested with numpy 2.
  "numpy<2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]
gpu = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "accelerate>=0.30",
  "timm>=1.0.17",
  "einops>=0.7",
  "ftfy==6.1.1",
  "scikit-image>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_vlm_fo1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
