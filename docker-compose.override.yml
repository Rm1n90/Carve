services:
  postgres:
    ports: ["15432:5432"]
  redis:
    ports: ["6379:6379"]
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
  api:
    ports: ["8000:8000"]
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
    command: ["bash", "-c", "alembic upgrade head && uvicorn carve_api.main:app --host 0.0.0.0 --port 8000 --reload"]
  worker:
    # v3.28 — bind-mount api source so the RQ worker picks up new
    # batch-payload dataclasses without a rebuild. Before this, queued
    # jobs failed with DeserializationError because the worker's
    # baked-in image pre-dated AutoVisualBatchPayload.
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
  model:
    ports: ["8100:8100"]
    volumes:
      - ./apps/model/src:/app/src
    command: ["uvicorn", "carve_model.main:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
  model-vlm-fo1:
    # v3.28 — bind-mount sidecar source so /caption endpoint additions
    # land without an image rebuild.
    volumes:
      - ./apps/model-vlm-fo1/src:/app/src
  web:
    ports: ["5173:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
