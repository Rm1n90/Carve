name: carve
#
# Memory containment (added 2026-06-17) — prevents a whole-host freeze.
# -------------------------------------------------------------------------
# Previously NO service had a host-RAM ceiling, so a memory spike (multiple
# users running SAM, a big batch/export, a large image decode) consumed all
# host RAM + swap and froze the entire machine (the OOM-killer fires too late;
# swap-thrash locks up the desktop). The per-service ``mem_limit`` below turns
# that into a CONTAINED, auto-restarting OOM-kill of a single container.
#
# Two non-obvious but critical details:
#   * Limits are top-level ``mem_limit`` (NOT ``deploy.resources.limits``),
#     because plain ``docker compose`` (non-swarm) silently IGNORES the
#     ``deploy`` form. The ``deploy`` block on model/model-vlm-fo1 stays —
#     it is only used for the GPU reservation, which compose DOES honor.
#   * ``memswap_limit == mem_limit`` disables per-container swap, so a
#     container that breaches its limit is OOM-killed PROMPTLY instead of
#     borrowing host swap and thrashing. That is the actual anti-freeze lever.
#
# The values below are sized for a ~16 GB single-GPU host that also runs a
# desktop (sum ≈ 12-13 GB, leaving headroom for the OS + page cache). On such
# a host do NOT enable VLM-FO1 (keep VLM_FO1_AVAILABLE=0) — SAM + a second VLM
# on one GPU/16 GB is over-subscribed. Raise these limits on larger hosts.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --maxmemory self-bounds Redis BELOW the container limit and evicts
    # under pressure (allkeys-lru) instead of growing into an OOM-kill.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: "no"

  api:
    build: ./apps/api
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_ENV: ${API_ENV:-development}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://model:8100}
      # /system/info path-rewrite root — see apps/api/src/carve_api/system/router.py
      HOST_ROOT: /host
      # /system/info GPU overlay — kept as a defensive fallback for hosts
      # where the model container is still device-pinned (older deploys
      # or local overrides). When the model service reports every host
      # GPU verbatim (the default now), this env is unused.
      SAM_GPU_ID: ${SAM_GPU_ID:-1}
    volumes:
      # Read-only bind of the host root so /system/info can enumerate
      # all host disks, not just the bind-mount the api container was
      # built on. ``rslave`` propagation keeps new host mounts visible
      # without leaking container mounts back out. Standard monitoring
      # pattern used by node-exporter, cAdvisor, Netdata.
      - /:/host:ro,rslave
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: ["rq", "worker", "default", "--url", "redis://redis:6379/0"]
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # The `model` service is optional. It runs SAM and YOLO inference and
  # requires NVIDIA Container Toolkit + a GPU. Manual annotation tools in
  # the web editor work fully without it.
  #
  # Start without inference (default — manual annotation only):
  #   docker compose up -d
  #
  # Start with inference enabled:
  #   docker compose --profile inference up -d
  model:
    build: ./apps/model
    restart: unless-stopped
    profiles:
      - inference
    # HOST-RAM ceiling (NOT VRAM). SAM weights/activations live in VRAM;
    # this caps the model service's host-side footprint (CUDA context,
    # pinned transfer buffers, decoded image arrays). 6 GB is generous for
    # single-user SAM image work; if the container OOM-restarts under heavy
    # concurrent load, the next step is capping the SAM input image to its
    # working resolution + decoding after admission (see sam/router.py).
    mem_limit: 6g
    memswap_limit: 6g
    # v3.7.8 — pass through NVIDIA GPU(s) to the model container.
    # Without this the YOLO + SAM models fall back to CPU which is
    # ~30-40x slower (yolov8n at ~2.7s/asset CPU vs ~70ms/asset GPU).
    # Requires nvidia-container-toolkit on the host.
    #
    # v3.27.1 — SAM 3.1 multiplex video tracking computes
    # `world_size = torch.cuda.device_count()` at module load; with
    # two GPUs visible to PyTorch it tries to shard the
    # language-feature buffer across both, which trips
    #   RuntimeError: indices should be either on cpu or on the same
    #   device as the indexed tensor (cuda:1)
    # because `txt_ids` lives on cuda:0 and `language_features` on
    # cuda:1. The original v3.27.1 fix used `device_ids: [SAM_GPU_ID]`
    # to physically hide the other GPU, but that also hid it from
    # `nvidia-smi`, which broke the System page on multi-GPU hosts.
    # The new approach: reserve every GPU at the container layer
    # (so `nvidia-smi` enumerates all of them for telemetry) and
    # restrict PyTorch via `CUDA_VISIBLE_DEVICES` further down in
    # `environment:`. `torch.cuda.device_count()` honors that env
    # var, so SAM 3.1 multiplex still sees world_size=1.
    #
    # NOTE: ``deploy.resources`` below is honored by ``docker compose`` ONLY
    # for the GPU device reservation. Memory limits MUST use the top-level
    # ``mem_limit`` above (the deploy.limits form is ignored outside swarm).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL_HOST: 0.0.0.0
      MODEL_PORT: 8100
      HF_TOKEN: ${HF_TOKEN:-}
      # Pin PyTorch to a single GPU while keeping nvidia-smi visibility
      # for the full set (see the `deploy:` block above for rationale).
      # `torch.cuda.device_count()` returns 1 with this set, so SAM 3.1
      # multiplex falls into the single-GPU fast path.
      CUDA_VISIBLE_DEVICES: ${SAM_GPU_ID:-1}
      # v3.22 — expandable_segments lets PyTorch's CUDA allocator return
      # memory to the system between request peaks, dramatically
      # reducing fragmentation on long batch jobs (auto-annotate over
      # hundreds of assets). Without this, sequential text-prompt calls
      # accumulate fragments until any new allocation OOMs even though
      # the in-use bytes are small.
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      # v3.8 Phase 3 — pass SAM_MODEL through so .env can pick the
      # boot-time variant. Without this, the container always starts on
      # the hard-coded default (sam2.1-large) and runtime /sam/switch
      # is the only way to change models. Default kept identical so
      # operators who never set SAM_MODEL see no behavior change.
      SAM_MODEL: ${SAM_MODEL:-sam2.1-large}
      # Plan 11 Task 7 — SAM 3.1 perf knobs. Defaults match what the
      # apps/model/src/carve_model/sam/perf.py helpers already pick on a
      # cuda host (bf16 + sdpa, no torch.compile). Surfaced here so
      # operators can flip them via .env without touching code.
      # See apps/docs/sam3p1.md for details.
      SAM_DTYPE: ${SAM_DTYPE:-bf16}
      SAM_ATTN_IMPL: ${SAM_ATTN_IMPL:-sdpa}
      SAM_COMPILE: ${SAM_COMPILE:-false}
      SAM_VIDEO_BACKEND: ${SAM_VIDEO_BACKEND:-multiplex}
      # v3.21+ -- VLM-FO1 precision filter. OFF by default. Setting to 1
      # registers the filter at lifespan (lazy-load on first opted-in
      # request). When OFF, /sam/text-prompt behaves identically to
      # pre-FO1, no Qwen2.5-VL-3B weights download. See spec at
      # docs/superpowers/specs/2026-05-05-vlm-fo1-sam3-image-integration-design.md
      VLM_FO1_AVAILABLE: ${VLM_FO1_AVAILABLE:-0}
      # Optional 4-bit quant for the FO1 base VLM (Qwen2.5-VL-3B).
      # Empty / unset = bf16 (~6 GB VRAM). "4bit" cuts that ~2x but
      # adds ~10-30% latency and may regress quality slightly.
      # Read by the model-vlm-fo1 sidecar; surfaced here so a single
      # .env entry configures both services symmetrically.
      VLM_FO1_QUANT: ${VLM_FO1_QUANT:-}
      # Sidecar URL inside the docker-compose network. The model
      # service calls this for capability probes (/healthz) and for
      # actual /filter requests when use_vlm_fo1=true.
      VLM_FO1_SIDECAR_URL: ${VLM_FO1_SIDECAR_URL:-http://model-vlm-fo1:8101}
      # SAM 3 proposal-generation tuning when use_vlm_fo1=true. Lower
      # threshold + bounded top-K give FO1 more candidates to filter
      # without exploding context length. Defaults match the spec; raise
      # threshold if your prompts produce too many candidates and FO1
      # latency becomes the bottleneck.
      SAM3_PROPOSAL_THRESHOLD: ${SAM3_PROPOSAL_THRESHOLD:-0.2}
      SAM3_TOPK_PROPOSALS: ${SAM3_TOPK_PROPOSALS:-64}
      # Optional: pin a specific GPU index. Default = use all visible GPUs.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # MinIO env — required so the model service's /yolo/train endpoint can
      # upload the produced best.pt back to MinIO. Mirrors the api/worker
      # service blocks. Without these, _yolo_train 502s at runtime.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - hf_cache:/root/.cache/huggingface
      # v3.23 — YOLOE checkpoints. Bind-mount survives rebuilds and
      # avoids baking ~150 MB into the image. Read-only so the runtime
      # can't accidentally mutate the operator-supplied weights.
      - ./weights/yoloe:/app/weights/yoloe:ro
      # v3.25.1 — device-preference persistence. The model service
      # writes /app/state/device_prefs.json on every preference change
      # so per-model device picks (sam/yolo/yoloe) survive container
      # rebuilds. Read-write so the service can update the file.
      - ./state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # VLM-FO1 sidecar — separate process pinned to transformers==4.50.1
  # so the upstream om-ai-lab/VLM-FO1 package can run unmodified. See
  # apps/model-vlm-fo1/ and carve_model.vlm_fo1.adapter for the split
  # rationale. Lazy-loads weights on first /filter request.
  #
  # WARNING (≤16 GB single-GPU hosts): leave VLM_FO1_AVAILABLE=0. Running
  # this alongside SAM oversubscribes both VRAM and host RAM. The mem_limit
  # caps the damage but the container will OOM-restart if it loads Qwen here.
  model-vlm-fo1:
    build: ./apps/model-vlm-fo1
    restart: unless-stopped
    profiles:
      - inference
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Inherits the same VLM_FO1_* env as the model service so a
      # single .env entry tunes both. The sidecar reads MODEL_PATH
      # and QUANT directly; AVAILABLE is read only by the model
      # service to gate the toggle.
      VLM_FO1_MODEL_PATH: ${VLM_FO1_MODEL_PATH:-}
      VLM_FO1_QUANT: ${VLM_FO1_QUANT:-}
      # v3.22 — idle-eviction: drop the 6 GB Qwen2.5-VL-3B weights
      # after this many seconds without a /filter request, freeing
      # GPU memory for SAM 3 / SAM 3.1 in the meantime. Default 15 min,
      # mirrors the model service's SAM_IDLE_TIMEOUT_S. Set to 0 to
      # disable (useful for benchmarks; pins ~6 GB permanently).
      VLM_FO1_IDLE_TIMEOUT_S: ${VLM_FO1_IDLE_TIMEOUT_S:-900}
      # Same allocator tweak as the model service.
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      # Share the HF cache with the model service. Both pull from the
      # same HF Hub paths (sam3 + FO1 are different repos so no
      # collision) and saves ~9 GB of duplicated downloads.
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/healthz').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build: ./apps/web
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  docs:
    build: ./apps/docs
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  hf_cache:
    name: carve-hf-cache
